<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>market place,product card</h1>
      <nav>
        <a href="#product">product</a>
        <a>kontak</a>
        <a id="keranjang">keranjang (<span id ="cart-cont">0</span>)</a>
      </nav>
    </header>
    <main>
      <div class="product-grid" id="product">
        <div class="product-card">
          <img src="gambar/images (1).jpg" alt="gambar" />
          <h3>silverqueen</h3>
          <p class="price">Rp-10.000</p>
          <div class="qty-steper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="btn-beli" data nama="silverqueen">beli sekarang</button>
        </div>
        <div class="product-card">
          <img src="gambar/id-11134207-822wi-mllsc39kvls1aa.jpg" alt="gambar" />
          <h3>kacang mente cheese</h3>
          <p class="price">Rp-35.000</p>
          <div class="qty-steper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="btn-beli" data nama="kacang mente cheese">beli sekarang</button>
        </div>
        <div class="product-card">
          <img src="gambar/images.jpg" alt="gambar" />
          <h3>good day tiramisu</h3>
          <p class="price">Rp-7.000</p>
          <div class="qty-steper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="btn-beli" data nama="good day tiramisu">beli sekarang</button>
        </div>
        <div class="product-card">
          <img src="gambar/1234521.jpg" alt="gambar" />
          <h3>kripik tempe</h3>
          <p class="price">Rp-13.000</p>
          <div class="qty-steper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
  8
          <button class="btn-beli" data nama="kripik tempe">beli sekarang</button>
        </div>
        <div class="product-card">
          <img src="gambar/produk_1582792494.jpg" alt="gambar" />
          <h3>ultramilk full cream</h3>
          <p class="price">Rp-5.500</p>
          <div class="qty-steper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="btn-beli" data nama="ultramilk full cream">beli sekarang</button>
        </div>
      </div>
    </main>
    <footer>
      <h2>hubungi saya</h2>
      <form class="kontak">
        <label for="nama">Name:</label>
        <input type="text" id="nama" placeholder="full name" \ />
        <label for="email">email:</label>
        <input type="email" id="email" placeholder="email" \ />
        <label for="pesan">pesan:</label>
        <textarea
          type="text"
          id="pesan"
          placeholder="masukan pesan yang ingin di sampaikan"
        ></textarea>
        <button class="btn-kirim">kirim pesan</button>
      </form>
      <p>copyright 2026 by {amaa}</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
